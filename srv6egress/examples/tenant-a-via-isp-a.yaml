# Example: send all egress from tenant-a namespace via ISP-A (color 100).
# Assumes the bgp-controller config defines: color 100 -> upstream isp-a -> End.DT6 SID of egress GW.
#
# The egress VIP pool below MUST carry allowedUses: [Tunnel]; the controller
# rejects an EgressPolicy whose egressIPPool lacks it (so egress VIPs can never
# be drawn from a pod/workload pool).
---
apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: tenant-egress-pool
spec:
  cidr: 2001:db8:e::/64
  allowedUses: [Tunnel]   # isolates this pool from pod IPAM
  nodeSelector: '!all()'
  disabled: true          # not used for normal pod IPAM
---
apiVersion: srv6egress.ryskn.io/v1alpha1
kind: EgressPolicy
metadata:
  name: tenant-a-via-isp-a
spec:
  selector:
    namespaceSelector:
      matchLabels:
        tenant: a
    # podSelector omitted => all pods in matched namespaces
  destinationCIDRs:
    - "2000::/3"   # global unicast; omit for "all off-cluster"
  egress:
    endpointSelector:
      nodeSelector:
        matchLabels:
          srv6egress.ryskn.io/role: egress
    color: 100
    egressIPPool: tenant-egress-pool
---
# A second policy: tenant-b uses ISP-B (color 200), demonstrating per-tenant path selection.
apiVersion: srv6egress.ryskn.io/v1alpha1
kind: EgressPolicy
metadata:
  name: tenant-b-via-isp-b
spec:
  selector:
    namespaceSelector:
      matchLabels:
        tenant: b
  egress:
    endpointSelector:
      nodeSelector:
        matchLabels:
          srv6egress.ryskn.io/role: egress
    color: 200
    egressIPPool: tenant-egress-pool
