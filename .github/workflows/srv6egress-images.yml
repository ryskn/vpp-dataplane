name: srv6egress images

# Build the srv6egress component images (amd64) and push them to GHCR, so the
# IPv6-only testbed cluster can import them (it cannot live-pull). The agent
# (calico-vpp-node) image is built through the existing calico-vpp flow; this
# workflow covers the two standalone Go binaries.
on:
  push:
    branches:
      - "srv6egress/**"
    paths:
      - "srv6egress/**"
      - "calico-vpp-agent/srv6egress/**"
      - ".github/workflows/srv6egress-images.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: bgp-controller
            dockerfile: srv6egress/Dockerfile.bgp-controller
          - name: vpp-route-sync
            dockerfile: srv6egress/Dockerfile.vpp-route-sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/srv6egress-${{ matrix.component.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ github.ref_name }}
